<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spot the Odd One</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--h:260;--bg:hsl(var(--h) 30% 9%);--panel:hsl(var(--h) 26% 15%);--ink:hsl(var(--h) 60% 95%);--muted:hsl(var(--h) 20% 68%);--pur:hsl(var(--h) 70% 68%);--gre:#22c55e;--red:#ef4444;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:24px 16px 40px;text-align:center}
h1{margin:0 0 4px;font-size:28px}
.sub{margin:0 0 12px;color:var(--muted);font-size:15px}
#grid{display:grid;grid-template-columns:26px repeat(7,1fr);gap:4px;margin:0 auto 14px;max-width:420px;background:var(--panel);padding:8px;border-radius:14px}
.lab{display:grid;place-items:center;font-weight:800;color:var(--pur);font-size:15px;text-transform:uppercase}
.c{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;font-size:var(--f,24px);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.c.good{background:var(--gre)}
.c.bad{background:var(--red);animation:shake .3s}
.c.dim{opacity:.2}
.c.reveal{outline:3px solid var(--ink);background:hsl(var(--h) 26% 25%)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.c.bad{animation:none}}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input{font:inherit;font-size:22px;letter-spacing:3px;text-transform:uppercase;width:150px;padding:10px;border-radius:8px;border:2px solid var(--pur);background:transparent;color:var(--ink);text-align:center}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:0;background:var(--pur);color:#1a1033;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--muted)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#msg{min-height:26px;font-weight:600;margin:6px 0 12px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
</style>
</head>
<body>
<main>
  <h1>Spot the Odd One</h1>
  <p class="sub">Every picture is the same except one. Type its code: the column letter (A to G) and the row number (1 to 7), like C3 or 3C.</p>
  <div id="grid" role="group" aria-label="Pictures"></div>
  <div class="row"><input id="g" autocomplete="off" autocapitalize="characters" maxlength="3" aria-label="Code of the odd picture"><button id="go">Check</button></div>
  <div id="msg" role="status"></div>
  <div class="row"><button class="ghost" id="new">New game</button><button class="ghost" id="hint">Hint</button><button class="ghost" id="give">Give up</button></div>
</main>
<script>
const N=7,ROUNDS=15,COLS="ABCDEFG";
const TIERS=[
 [["🍋","🌽"],["🍊","🥕"],["🍏","🍈"],["🍅","🌶️"],["🐘","🦏"],["🐸","🐢"],["🍩","🍪"],["🥛","🍼"],["🚕","🚖"],["🙂","🙃"],["👍","👎"],["⬅️","➡️"],["🔒","🔓"],["🔍","🔎"],["🏠","🏡"],["🌛","🌜"],["🍀","☘️"],["🔺","🔻"],["■","▮"],["◆","■"],["♥︎","★"],["💛","⭐"],["❤️","♦️"],["🌻","🌼"],["🌷","🌹"],["🐪","🐫"],["🙈","🙉"],["🐱","🐈"],["🐶","🐕"],["🐔","🐓"],["🐵","🐒"]],
 [["🍎","🍅"],["🍐","🍏"],["🍒","🍓"],["🥔","🌰"],["🥜","🌰"],["🥐","🥖"],["🥞","🧇"],["🚓","🚔"],["🚘","🚗"],["🚍","🚌"],["🚅","🚄"],["🚊","🚋"],["✈️","🛩️"],["🛫","🛬"],["🚤","🛥️"],["🚢","🛳️"],["🏍️","🛵"],["🚜","🚛"],["🚚","🚛"],["🚐","🚌"],["⛵","🚤"],["😀","😃"],["🕐","🕜"],["⏪","⏩"],["🌖","🌗"],["🔸","🔶"],["↩️","↪️"],["✊","👊"],["🍆","🍇"],["🥦","🥬"],["🧅","🧄"],["🍤","🦐"],["🍗","🍖"],["🥓","🥩"],["🧈","🧀"],["🥝","🥑"],["🐍","🦎"],["🦎","🐊"],["🦀","🦞"],["🐬","🐋"],["🐳","🐋"],["🐀","🐁"],["🐖","🐷"],["🐏","🐑"],["🐂","🐃"],["🐎","🐴"],["🐥","🐤"],["🦅","🦉"],["🟦","🔷"],["📷","📸"],["📹","🎥"],["☎️","📞"],["📱","📲"],["🖥️","💻"],["🎹","⌨️"],["⛄","☃️"],["🌲","🎄"],["🍷","🍸"],["🍺","🍻"],["☕","🍵"],["♦️","🟥"],["🔶","🟧"],["🟦","🔹"],["🟧","🔸"],["□","▭"],["◇","□"],["♡","☆"],["💙","🔷"],["🧡","🔶"],["❤️","🟥"],["💛","🌟"],["🌸","🌺"],["🌹","🌺"],["🍏","🍈"],["🍐","🍈"],["🌻","☀️"],["🐰","🐇"],["🐯","🐅"],["🐮","🐄"],["🐷","🐽"],["🙉","🙊"],["🙈","🙊"],["🐊","🐢"],["🦐","🦞"],["🦓","🐴"],["🦔","🐿️"],["🦝","🦊"],["🐃","🐄"],["🦛","🦏"],["🕊️","🦢"],["🦌","🐴"],["😃","😄"],["😁","😆"],["😆","😅"],["😅","😂"],["🙂","😊"],["😍","🥰"],["😘","😗"],["😛","😜"],["🤒","🤕"],["✌️","🤞"],["🙏","👏"]],
 [["😄","😁"],["😐","😑"],["😔","😞"],["🕑","🕝"],["♥️","❤️"],["🌗","🌘"],["🔁","🔂"],["🕘","🕤"],["🕙","🕥"],["🕖","🕢"],["🌒","🌘"],["🔄","🔃"],["💬","💭"],["💦","💧"],["🍂","🍁"],["🍃","🌿"],["✋","🖐️"],["🐶","🐺"],["🐭","🐹"],["🐻","🐨"],["🐑","🐐"],["🏫","🏨"],["🏢","🏬"],["📌","📍"],["🔨","⚒️"],["🔑","🗝️"],["⌚","⏱️"],["🦁","🐯"],["🪓","🔨"],["⛏️","⚒️"],["🔩","⚙️"],["💡","🔦"],["🔋","🔌"],["👓","🕶️"],["👟","🥾"],["🧢","🎩"],["👜","👛"],["🧳","💼"],["🥤","🧃"],["🛋️","🛏️"],["🌟","💫"],["🐌","🐚"],["🐙","🦑"],["🦈","🐬"],["🦆","🦢"],["🐓","🦃"],["🥄","🍴"],["🍴","🔪"],["▬","■"],["▮","▭"],["♦️","♥️"],["🌼","🏵️"],["🌺","🌷"],["🐭","🐁"],["🦙","🐑"],["🐺","🐕"],["🐧","🕊️"],["😗","😙"],["😙","😚"],["😜","😝"],["😋","😛"],["🤨","😐"],["😶","😐"],["😏","😒"],["😒","🙄"],["😮","😯"],["😲","😳"],["😧","😦"],["😨","😰"],["😭","😢"],["😖","😣"],["😫","😩"],["😤","😠"],["🥱","😪"],["😴","😪"],["😷","🤒"],["😈","👿"],["🤟","🤘"]],
 [["😟","😕"],["😥","😢"],["🕒","🕞"],["🕓","🕟"],["🕔","🕠"],["🕚","🕦"],["🕛","🕧"],["🕗","🕣"],["🌔","🌓"],["↖️","↗️"],["↙️","↘️"],["⏪","◀️"],["🔼","⏫"],["🔽","⏬"],["◀️","▶️"],["🌧️","🌨️"],["⛅","🌤️"],["🌱","🌿"],["🔹","🔷"],["⬆️","⬇️"],["🕰️","⏰"],["📎","🖇️"],["🌳","🌲"],["🌴","🌳"],["🌹","🥀"],["🐕","🐩"],["🙂","😌"],["🐥","🐣"],["🔔","🔕"],["⭐","🌟"],["☀️","🌞"],["🌙","🌛"],["🌚","🌝"],["🔺","🔻"],["▮","▬"],["◆","◇"],["★","☆"],["💛","🌟"],["🌻","🏵️"],["🐁","🐀"],["🐤","🐥"],["🐹","🐁"],["🐻","🐨"],["🐈","🐱"],["😰","😥"],["😬","😁"],["😣","😫"],["😞","😟"],["😕","😐"],["😑","😶"],["😯","😮"],["😚","😗"],["😝","😜"],["😪","😴"],["😩","😖"],["😆","😄"]]
];
const HUES=[0,15,155,180,205,230,260,285,320];
const $=id=>document.getElementById(id);
let round,hints,oddIdx,over,locked,hue=-1;
const code=i=>COLS[i%N]+(Math.floor(i/N)+1);
function build(){
  const tier=round<3?0:round<7?1:round<11?2:3;
  const pair=TIERS[tier][Math.floor(Math.random()*TIERS[tier].length)];
  const flip=Math.random()<.5,base=pair[flip?1:0],odd=pair[flip?0:1];
  oddIdx=Math.floor(Math.random()*N*N);
  let h;do{h=HUES[Math.floor(Math.random()*HUES.length)]}while(h===hue);
  hue=h;document.documentElement.style.setProperty("--h",h);
  const gw=Math.min(420,document.documentElement.clientWidth-32)-16,cell=(gw-26-N*4)/N;
  $("grid").style.setProperty("--f",Math.max(14,Math.min(38,Math.floor(cell*0.72)))+"px");
  let g='<div></div>'+[...COLS].map(c=>`<div class="lab">${c}</div>`).join("");
  for(let r=0;r<N;r++){
    g+=`<div class="lab">${r+1}</div>`;
    for(let c=0;c<N;c++){const i=r*N+c;g+=`<div class="c" data-i="${i}">${i===oddIdx?odd:base}</div>`}
  }
  $("grid").innerHTML=g;
  locked=false;$("g").value="";
}
function cellEl(i){return $("grid").querySelector(`.c[data-i="${i}"]`)}
function newGame(){
  round=0;hints=2;over=false;
  $("msg").textContent="";$("hint").disabled=false;$("give").disabled=false;$("g").disabled=false;$("go").disabled=false;
  build();$("g").focus();
}
function end(msg){
  over=true;locked=true;
  $("hint").disabled=true;$("give").disabled=true;$("g").disabled=true;$("go").disabled=true;
  const el=cellEl(oddIdx);if(el)el.classList.add("reveal");
  $("msg").textContent=msg;
}
function parse(v){
  const m=v.trim().replace(/\s+/g,"").match(/^([a-g])([1-7])$|^([1-7])([a-g])$/i);
  if(!m)return null;
  const col=(m[1]||m[4]).toUpperCase(),row=+(m[2]||m[3]);
  return (row-1)*N+COLS.indexOf(col);
}
function check(){
  if(locked||over)return;
  const i=parse($("g").value);
  if(i===null){$("msg").textContent="Type a column letter A to G and a row number 1 to 7, like C3 or 3C.";return}
  $("g").value="";
  const el=cellEl(i);
  if(i===oddIdx){
    el.classList.add("good");locked=true;
    if(round===ROUNDS-1){over=true;$("msg").textContent="You found every odd one! You win!";$("hint").disabled=true;$("give").disabled=true;$("g").disabled=true;$("go").disabled=true;confetti();return}
    $("msg").textContent=`Correct! It was ${code(i)}.`;confetti();
    setTimeout(()=>{round++;$("msg").textContent="";build();$("g").focus()},900);
  }else{
    el.classList.add("bad");
    $("msg").textContent=`${code(i)} is not it. Try again.`;$("g").focus();
  }
}
$("go").onclick=check;
$("g").onkeydown=e=>{if(e.key==="Enter")check()};
$("hint").onclick=()=>{
  if(over||locked)return;
  if(hints<=0){$("msg").textContent="No hints left.";return}
  hints--;
  const r=Math.floor(oddIdx/N),c=oddIdx%N;
  if(hints===1){ // first hint: the row
    $("grid").querySelectorAll(".c").forEach(e=>{if(Math.floor(+e.dataset.i/N)!==r)e.classList.add("dim")});
    $("msg").textContent=`Hint: it is in row ${r+1}. 1 hint left.`;
  }else{ // second hint: left or right half
    const left=c<4;
    $("grid").querySelectorAll(".c").forEach(e=>{if((e.dataset.i%N<4)!==left)e.classList.add("dim")});
    $("msg").textContent=`Hint: it is in columns ${left?"A to D":"E to G"}. No hints left.`;
  }
};
$("give").onclick=()=>{if(!over)end(`You gave up. The odd one was ${code(oddIdx)}.`)};
$("new").onclick=newGame;
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.id="confetti";c.width=innerWidth;c.height=innerHeight;document.body.append(c);
  const x=c.getContext("2d"),cols=[0,45,150,200,260,320].map(h=>`hsl(${h} 85% 55%)`);
  const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;
  (function f(){
    x.clearRect(0,0,c.width,c.height);t++;
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(t<160)requestAnimationFrame(f);else c.remove();
  })();
}
newGame();
</script>
</body>
</html>
